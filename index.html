<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Team Victorioso - Oportunidad profesional en servicios financieros. Capacitación, flexibilidad y crecimiento."
  />

  <title>Team Victorioso | Construye Tu Futuro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>

    /* ==============================
       ROOT
    ============================== */

    :root {
      --navy: #03182e;
      --navy-2: #061f3b;
      --navy-3: #0a2b50;
      --blue: #0a68d8;
      --blue-light: #2d93ff;
      --gold: #d7a84a;
      --gold-light: #f0ca77;
      --white: #ffffff;
      --off-white: #f5f8fc;
      --text: #dce8f5;
      --muted: #9eb0c4;
      --dark: #020b15;
      --border: rgba(255,255,255,0.11);
      --shadow: 0 25px 70px rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(17,104,216,.15), transparent 32%),
        var(--dark);
      color: var(--white);
      overflow-x: hidden;
      line-height: 1.6;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(1180px, calc(100% - 40px));
      margin-inline: auto;
    }

    .section {
      padding: 105px 0;
    }

    .section-label {
      color: var(--gold-light);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .section-title {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(2rem, 4vw, 3.8rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .section-description {
      color: var(--muted);
      max-width: 680px;
      font-size: 1.05rem;
      margin-top: 22px;
    }

    .gold {
      color: var(--gold-light);
    }


    /* ==============================
       NAVIGATION
    ============================== */

    header {
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1000;
      background: rgba(2,11,21,.72);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    nav {
      height: 82px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-symbol {
      width: 45px;
      height: 45px;
      background: linear-gradient(135deg, var(--blue-light), var(--blue));
      clip-path: polygon(
        50% 0%,
        100% 20%,
        86% 100%,
        50% 72%,
        14% 100%,
        0 20%
      );
      display: grid;
      place-items: center;
      font-family: "Montserrat", sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
    }

    .brand-name strong {
      display: block;
      font-family: "Montserrat", sans-serif;
      font-size: .95rem;
      line-height: 1;
      letter-spacing: .05em;
    }

    .brand-name span {
      font-size: .67rem;
      color: var(--blue-light);
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-links a {
      font-size: .9rem;
      color: #c5d2df;
      transition: .25s ease;
    }

    .nav-links a:hover {
      color: white;
    }

    .nav-button {
      padding: 12px 20px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #09131e !important;
      font-weight: 800;
    }

    .menu-button {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 1.6rem;
      cursor: pointer;
    }


    /* ==============================
       HERO
    ============================== */

    .hero {
      min-height: 100vh;
      padding: 150px 0 90px;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: rgba(15,109,219,.16);
      filter: blur(100px);
      right: -250px;
      top: 20px;
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 70px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border: 1px solid rgba(215,168,74,.35);
      background: rgba(215,168,74,.08);
      border-radius: 100px;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: .72rem;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 15px var(--gold);
    }

    .hero h1 {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(3.15rem, 6.5vw, 6.7rem);
      line-height: .92;
      letter-spacing: -.065em;
      font-weight: 900;
    }

    .hero h1 span {
      background: linear-gradient(
        135deg,
        #ffffff 5%,
        #54a5ff 48%,
        #0b6bdb 100%
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-text {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 620px;
      margin: 30px 0 35px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .primary-btn,
    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 27px;
      border-radius: 11px;
      font-weight: 800;
      transition: .3s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #081422;
      box-shadow: 0 12px 35px rgba(215,168,74,.2);
    }

    .primary-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 17px 40px rgba(215,168,74,.30);
    }

    .secondary-btn {
      border: 1px solid var(--border);
      color: white;
      background: rgba(255,255,255,.03);
    }

    .secondary-btn:hover {
      background: rgba(255,255,255,.07);
    }


    /* ==============================
       HERO IMAGE
    ============================== */

    .hero-image-wrap {
      position: relative;
    }

    .hero-image-frame {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: var(--shadow);
    }

    .hero-image-frame img {
      width: 100%;
      height: auto;
    }

    .hero-image-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 80px rgba(0,0,0,.18);
      pointer-events: none;
    }

    .floating-card {
      position: absolute;
      left: -35px;
      bottom: 35px;
      max-width: 240px;
      padding: 20px;
      background: rgba(3,24,46,.93);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 17px;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }

    .floating-card small {
      display: block;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: .15em;
      font-size: .65rem;
      margin-bottom: 7px;
    }

    .floating-card strong {
      font-family: "Montserrat", sans-serif;
      font-size: 1rem;
    }


    /* ==============================
       TRUST BAR
    ============================== */

    .trust {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.018);
    }

    .trust-grid {
      min-height: 105px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
    }

    .trust-item {
      text-align: center;
      border-right: 1px solid var(--border);
      padding: 20px;
    }

    .trust-item:last-child {
      border-right: 0;
    }

    .trust-item strong {
      display: block;
      font-family: "Montserrat", sans-serif;
      font-size: 1rem;
      margin-bottom: 3px;
    }

    .trust-item span {
      color: var(--muted);
      font-size: .8rem;
    }


    /* ==============================
       OPPORTUNITY
    ============================== */

    .opportunity {
      background:
        radial-gradient(circle at 10% 30%, rgba(15,109,219,.12), transparent 30%);
    }

    .benefit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 55px;
    }

    .benefit-card {
      min-height: 240px;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.015)
        );
      transition: .3s ease;
    }

    .benefit-card:hover {
      transform: translateY(-7px);
      border-color: rgba(45,147,255,.4);
      background: rgba(12,52,93,.28);
    }

    .number {
      color: var(--gold-light);
      font-family: "Montserrat", sans-serif;
      font-size: .75rem;
      letter-spacing: .14em;
      margin-bottom: 25px;
    }

    .benefit-card h3 {
      font-family: "Montserrat", sans-serif;
      font-size: 1.25rem;
      margin-bottom: 12px;
    }

    .benefit-card p {
      color: var(--muted);
      font-size: .93rem;
    }


    /* ==============================
       FEATURE
    ============================== */

    .feature {
      background: #061526;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 70px;
      align-items: center;
    }

    .feature-panel {
      padding: 45px;
      border: 1px solid rgba(215,168,74,.22);
      border-radius: 24px;
      background:
        linear-gradient(
          145deg,
          rgba(215,168,74,.07),
          rgba(255,255,255,.015)
        );
    }

    .feature-list {
      display: grid;
      gap: 22px;
      margin-top: 35px;
    }

    .feature-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .check {
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      border-radius: 50%;
      background: rgba(45,147,255,.15);
      border: 1px solid rgba(45,147,255,.45);
      color: #65adff;
      display: grid;
      place-items: center;
      font-size: .72rem;
      margin-top: 1px;
    }

    .feature-row strong {
      display: block;
      margin-bottom: 3px;
    }

    .feature-row span {
      color: var(--muted);
      font-size: .9rem;
    }


    /* ==============================
       STEPS
    ============================== */

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 60px;
    }

    .step {
      position: relative;
      padding: 30px;
      border-top: 2px solid rgba(45,147,255,.35);
      background: rgba(255,255,255,.02);
    }

    .step span {
      font-family: "Montserrat", sans-serif;
      color: var(--blue-light);
      font-weight: 800;
      font-size: 2.4rem;
      opacity: .42;
    }

    .step h3 {
      font-family: "Montserrat", sans-serif;
      margin: 15px 0 10px;
    }

    .step p {
      color: var(--muted);
      font-size: .9rem;
    }


    /* ==============================
       REQUIREMENTS
    ============================== */

    .requirements {
      background:
        linear-gradient(
          135deg,
          #072a51,
          #03182e 60%,
          #071421
        );
    }

    .requirements-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .requirement-list {
      display: grid;
      gap: 14px;
    }

    .requirement {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.09);
      padding: 17px 20px;
      border-radius: 13px;
    }

    .requirement span:first-child {
      color: var(--gold-light);
      font-weight: 900;
    }


    /* ==============================
       CTA
    ============================== */

    .cta {
      padding: 110px 0;
    }

    .cta-box {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      padding: 75px 55px;
      text-align: center;
      background:
        linear-gradient(
          135deg,
          #0b65ca,
          #073d79,
          #061c34
        );
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: var(--shadow);
    }

    .cta-box::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      top: -250px;
      right: -80px;
    }

    .cta h2 {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(2.2rem, 5vw, 4.5rem);
      line-height: 1;
      max-width: 850px;
      margin: 0 auto 22px;
      letter-spacing: -.05em;
    }

    .cta p {
      color: #d9e9fa;
      max-width: 700px;
      margin: 0 auto 32px;
    }


    /* ==============================
       CONTACT
    ============================== */

    .contact-grid {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 60px;
    }

    .contact-details {
      margin-top: 40px;
      display: grid;
      gap: 15px;
    }

    .contact-card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.025);
    }

    .contact-card span {
      color: var(--muted);
      display: block;
      font-size: .75rem;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .contact-card strong {
      font-size: 1rem;
    }

    .contact-panel {
      padding: 45px;
      background: linear-gradient(
        145deg,
        rgba(10,104,216,.17),
        rgba(255,255,255,.02)
      );
      border-radius: 22px;
      border: 1px solid rgba(45,147,255,.22);
    }

    .contact-panel h3 {
      font-family: "Montserrat", sans-serif;
      font-size: 1.7rem;
      margin-bottom: 14px;
    }

    .contact-panel p {
      color: var(--muted);
      margin-bottom: 28px;
    }


    /* ==============================
       DISCLAIMER
    ============================== */

    .disclaimer {
      border-top: 1px solid var(--border);
      padding: 35px 0;
    }

    .disclaimer p {
      color: #66798c;
      font-size: .75rem;
      max-width: 950px;
      line-height: 1.7;
    }


    /* ==============================
       FOOTER
    ============================== */

    footer {
      background: #01070d;
      border-top: 1px solid var(--border);
      padding: 55px 0 30px;
    }

    .footer-grid {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      align-items: flex-start;
    }

    .footer-brand p {
      color: var(--muted);
      font-size: .85rem;
      max-width: 340px;
      margin-top: 17px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
    }

    .footer-links a {
      color: var(--muted);
      font-size: .85rem;
    }

    .footer-bottom {
      margin-top: 45px;
      padding-top: 25px;
      border-top: 1px solid rgba(255,255,255,.06);
      color: #526376;
      font-size: .75rem;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }


    /* ==============================
       FLOATING APPLY BUTTON
    ============================== */

    .floating-apply {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 900;
      padding: 14px 21px;
      border-radius: 100px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #07111c;
      font-size: .85rem;
      font-weight: 900;
      box-shadow: 0 15px 40px rgba(0,0,0,.38);
      transition: .3s ease;
    }

    .floating-apply:hover {
      transform: translateY(-3px);
    }


    /* ==============================
       ANIMATION
    ============================== */

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity .75s ease, transform .75s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }


    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 950px) {

      .hero-grid,
      .feature-grid,
      .requirements-grid,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .hero-grid {
        gap: 50px;
      }

      .benefit-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .steps-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .floating-card {
        left: 15px;
      }

      .trust-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .trust-item:nth-child(2) {
        border-right: 0;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 82px;
        left: 0;
        width: 100%;
        padding: 25px;
        flex-direction: column;
        background: rgba(2,11,21,.98);
        border-top: 1px solid var(--border);
      }

      .nav-links.open {
        display: flex;
      }

      .menu-button {
        display: block;
      }

    }

    @media (max-width: 650px) {

      .container {
        width: min(100% - 28px, 1180px);
      }

      .section {
        padding: 75px 0;
      }

      .hero {
        padding-top: 125px;
      }

      .hero h1 {
        font-size: clamp(3rem, 15vw, 4.7rem);
      }

      .hero-text {
        font-size: 1rem;
      }

      .hero-actions {
        flex-direction: column;
      }

      .primary-btn,
      .secondary-btn {
        width: 100%;
      }

      .benefit-grid,
      .steps-grid,
      .trust-grid {
        grid-template-columns: 1fr;
      }

      .trust-item {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .trust-item:last-child {
        border-bottom: none;
      }

      .feature-panel,
      .contact-panel {
        padding: 28px;
      }

      .cta-box {
        padding: 55px 24px;
      }

      .floating-card {
        position: relative;
        left: auto;
        bottom: auto;
        margin: -30px 15px 0;
      }

      .footer-grid,
      .footer-bottom {
        flex-direction: column;
      }

      .floating-apply {
        left: 15px;
        right: 15px;
        bottom: 14px;
        text-align: center;
      }

      footer {
        padding-bottom: 95px;
      }

    }

  </style>
</head>


<body>


  <!-- ==========================
       NAVIGATION
  =========================== -->

  <header>

    <div class="container">

      <nav>

        <a class="brand" href="#inicio">

          <div class="brand-symbol">
            V
          </div>

          <div class="brand-name">
            <strong>TEAM VICTORIOSO</strong>
            <span>Servicios Financieros</span>
          </div>

        </a>

        <div class="nav-links" id="navLinks">
